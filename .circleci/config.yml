version: 2.1

jobs:
  build:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - maven-v1-{{ checksum "pom.xml" }}
            - maven-v1-
      - run:
          name: Compile and package application
          command: bash ./mvnw -B clean package -DskipTests
      - save_cache:
          paths:
            - ~/.m2/repository
          key: maven-v1-{{ checksum "pom.xml" }}

  test:
    docker:
      - image: cimg/openjdk:21.0
      - image: postgres:16
        environment:
          POSTGRES_DB: taskflow_test
          POSTGRES_USER: taskflow_test
          POSTGRES_PASSWORD: ci-test-only-password

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/taskflow_test
      SPRING_DATASOURCE_USERNAME: taskflow_test
      SPRING_DATASOURCE_PASSWORD: ci-test-only-password
      OPENROUTER_API_KEY: ci-placeholder-not-a-real-key

    steps:
      - checkout

      - restore_cache:
          keys:
            - maven-v1-{{ checksum "pom.xml" }}
            - maven-v1-

      - run:
          name: Wait for PostgreSQL
          command: dockerize -wait tcp://localhost:5432 -timeout 60s

      - run:
          name: Run automated tests
          command: bash ./mvnw -B verify

      - store_test_results:
          path: target/surefire-reports

      - store_artifacts:
          path: target/surefire-reports

  publish:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker image
          command: |
            docker build --platform linux/amd64 \
              -t "${DOCKERHUB_USERNAME}/taskflow:latest" \
              -t "${DOCKERHUB_USERNAME}/taskflow:${CIRCLE_SHA1}" .
      - run:
          name: Log in and push to Docker Hub
          command: |
            echo "$DOCKERHUB_TOKEN" | docker login \
              --username "$DOCKERHUB_USERNAME" --password-stdin
            docker push "${DOCKERHUB_USERNAME}/taskflow:${CIRCLE_SHA1}"
            docker push "${DOCKERHUB_USERNAME}/taskflow:latest"

workflows:
  build_test_publish:
    jobs:
      - build:
          filters:
            branches:
              only: main
      - test:
          requires:
            - build
          filters:
            branches:
              only: main
      - publish:
          context: taskflow-api
          requires:
            - test
          filters:
            branches:
              only: main